<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings — Capstone Project</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container site-header__inner">
        <a class="site-header__brand" href="index.html">Capstone</a>
        <nav class="site-nav" aria-label="Main navigation">
          <a class="site-nav__link" href="index.html">Home</a>
          <a class="site-nav__link site-nav__link--active" href="settings.html">Settings</a>
        </nav>
      </div>
    </header>

    <main class="container page">
      <section class="card settings-card" aria-labelledby="settings-heading">
        <header class="settings-card__header">
          <h1 id="settings-heading">Settings</h1>
          <p class="settings-card__subtitle">Update your profile and preferences.</p>
        </header>

        <div
          id="form-status"
          class="form-status"
          role="status"
          aria-live="polite"
          hidden
        ></div>

        <form id="settings-form" class="settings-form" novalidate>
          <div class="form-field">
            <label class="form-field__label" for="full-name">Full Name</label>
            <input
              class="form-field__input"
              type="text"
              id="full-name"
              name="fullName"
              autocomplete="name"
              required
              aria-invalid="false"
              aria-describedby="full-name-error"
            />
            <p class="form-field__error" id="full-name-error" role="alert"></p>
          </div>

          <div class="form-field">
            <label class="form-field__label" for="email">Email</label>
            <input
              class="form-field__input"
              type="email"
              id="email"
              name="email"
              autocomplete="email"
              required
              aria-invalid="false"
              aria-describedby="email-error"
            />
            <p class="form-field__error" id="email-error" role="alert"></p>
          </div>

          <fieldset class="form-field form-field--fieldset">
            <legend class="form-field__label" id="theme-label">Theme</legend>
            <div
              class="radio-group"
              id="theme-group"
              role="radiogroup"
              aria-labelledby="theme-label"
              aria-describedby="theme-error"
              aria-invalid="false"
            >
              <label class="radio-option">
                <input
                  type="radio"
                  name="theme"
                  value="light"
                  id="theme-light"
                />
                <span>Light</span>
              </label>
              <label class="radio-option">
                <input
                  type="radio"
                  name="theme"
                  value="dark"
                  id="theme-dark"
                />
                <span>Dark</span>
              </label>
            </div>
            <p class="form-field__error" id="theme-error" role="alert"></p>
          </fieldset>

          <div class="form-field form-field--checkbox">
            <label class="checkbox-option" for="notifications">
              <input
                type="checkbox"
                id="notifications"
                name="notifications"
              />
              <span>Enable Notifications</span>
            </label>
          </div>

          <div class="form-actions">
            <button class="btn btn--primary" type="submit" id="save-btn">
              Save Settings
            </button>
          </div>
        </form>
      </section>
    </main>

    <script src="js/settings.js"></script>
  </body>
</html>
